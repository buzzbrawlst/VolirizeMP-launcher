<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VolirizeMP • News</title>
<style>
:root{color-scheme:dark;--bg:#0d1018;--panel:#171c29;--line:#2b3142;--accent:#8d83ff;--muted:#9ba2b6}
*{box-sizing:border-box}body{margin:0;padding:34px;background:radial-gradient(ellipse at 85% 0%,#29265a 0,transparent 38%),#0d1018;color:#f7f7fc;font:14px Inter,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}h1{font-size:34px;margin:0 0 7px;letter-spacing:-1px}.sub{color:var(--muted)}button{background:#7567f8;color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
#news{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.card{overflow:hidden;background:linear-gradient(145deg,#1c2231,#131722);border:1px solid var(--line);border-radius:17px}.cover{height:175px;background:#252b40;object-fit:cover;width:100%}.body{padding:19px}.tag{color:#aaa3ff;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.date{color:#737c91;font-size:11px;margin:7px 0}.title{font-size:19px;margin:0 0 9px}.desc{color:#aeb4c4;line-height:1.6;margin:0}.state{color:var(--muted);padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
</style></head><body>
<header><div><h1>Latest news</h1><div class="sub">Updates, announcements and project progress.</div></div><button onclick="loadNews()">↻ Refresh</button></header>
<main id="news"><div class="state">Loading announcements…</div></main>
<script>
const API_BASE_URL="https://YOUR-BACKEND-URL"; // Set this to the same API URL as Config.cs
async function loadNews(){const root=document.querySelector("#news");root.innerHTML='<div class="state">Loading announcements…</div>';
try{if(API_BASE_URL.includes("YOUR-BACKEND-URL"))throw new Error("Set API_BASE_URL in news.html.");
const r=await fetch(API_BASE_URL.replace(/\/$/,"")+"/news");if(!r.ok)throw new Error("News request failed ("+r.status+").");const items=await r.json();
if(!Array.isArray(items)||!items.length){root.innerHTML='<div class="state">There are no announcements yet.</div>';return;}
root.innerHTML=items.map(n=>'<article class="card">'+(n.image?'<img class="cover" src="'+esc(n.image)+'" alt="">':'<div class="cover"></div>')+'<div class="body"><div class="tag">'+esc(n.category||"Update")+'</div><div class="date">'+esc(n.date||"")+'</div><h2 class="title">'+esc(n.title||"Untitled")+'</h2><p class="desc">'+esc(n.description||"")+'</p></div></article>').join("");
}catch(e){root.innerHTML='<div class="state">'+esc(e.message)+'</div>';}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}loadNews();
</script></body></html>
